<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>レジュメ</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <!-- ヘッダー：左にロゴ、右にメニュー -->
    <header class="header">
      <div class="container header-inner">
        <h1 class="logo">レジュメ</h1>
        <nav>
          <ul class="nav-list">
            <li><a href="#about">自己紹介</a></li>
            <li><a href="#profile">プロフィール画像</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <!-- メインビジュアル：全幅・高さ600px -->
      <div class="main-visual">
        <img class="main-visual-image" src="images/main-visual.png" alt="メインビジュアル">
      </div>

      <!-- 自己紹介：テキストと丸い画像を横並び・中央寄せ -->
      <section class="about" id="about">
        <div class="container">
          <h2 class="section-title">自己紹介</h2>
          <div class="about-content">
            <div class="about-body">
              <h3 class="about-name">鈴木 太郎</h3>
              <p class="about-text">
                鈴木太郎です。鈴木太郎です。鈴木太郎です。鈴木太郎です。鈴木太郎です。<br>
                鈴木太郎です。鈴木太郎です。鈴木太郎です。鈴木太郎です。鈴木太郎です。<br>
                鈴木太郎です。鈴木太郎です。鈴木太郎です。鈴木太郎です。鈴木太郎です。
              </p>
            </div>
            <img class="about-image" src="images/profile-icon.png" alt="鈴木太郎のプロフィール写真">
          </div>
        </div>
      </section>

      <!-- プロフィール画像：3枚を横並び -->
      <section class="profile" id="profile">
        <div class="container">
          <h2 class="section-title">プロフィール画像</h2>
          <ul class="profile-list">
            <li class="profile-card">
              <h3 class="profile-card-title">タイトルタイトル</h3>
              <p class="profile-card-text">テキストテキストテキスト</p>
              <img class="profile-card-image" src="images/profile-card.png" alt="プロフィール画像">
            </li>
            <li class="profile-card">
              <h3 class="profile-card-title">タイトルタイトル</h3>
              <p class="profile-card-text">テキストテキストテキスト</p>
              <img class="profile-card-image" src="images/profile-card.png" alt="プロフィール画像">
            </li>
            <li class="profile-card">
              <h3 class="profile-card-title">タイトルタイトル</h3>
              <p class="profile-card-text">テキストテキストテキスト</p>
              <img class="profile-card-image" src="images/profile-card.png" alt="プロフィール画像">
            </li>
          </ul>
        </div>
      </section>
    </main>

    <!-- フッター -->
    <footer class="footer">
      <p class="copyright">© 2023 taro suzuki</p>
    </footer>
  </body>
</html>
