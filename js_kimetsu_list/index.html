<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>鬼滅の刃 キャラクター一覧</title>
    <!-- Tailwind CSS を CDN で読み込む -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.4"></script>
    <script src="script.js" defer></script>
  </head>
  <body class="min-h-screen bg-stone-100 px-4 py-10 text-stone-800">
    <main class="mx-auto max-w-4xl">
      <h1 class="mb-6 text-center text-2xl font-bold">鬼滅の刃 キャラクター一覧</h1>

      <!-- ラジオボタン：選ぶと、その種類のキャラクターを API から取得する -->
      <fieldset class="mb-8 flex flex-wrap justify-center gap-x-6 gap-y-2">
        <legend class="sr-only">表示するキャラクターの種類</legend>
        <label class="flex cursor-pointer items-center gap-2">
          <input type="radio" name="category" value="all" checked>
          全キャラクター
        </label>
        <label class="flex cursor-pointer items-center gap-2">
          <input type="radio" name="category" value="kisatsutai">
          鬼殺隊
        </label>
        <label class="flex cursor-pointer items-center gap-2">
          <input type="radio" name="category" value="hashira">
          柱
        </label>
        <label class="flex cursor-pointer items-center gap-2">
          <input type="radio" name="category" value="oni">
          鬼
        </label>
      </fieldset>

      <!-- ローディング画面（読み込み中だけ表示する） -->
      <div id="loading" class="flex flex-col items-center gap-3 py-20" hidden>
        <div class="size-10 animate-spin rounded-full border-4 border-stone-300 border-t-red-700"></div>
        <p class="text-sm text-stone-500">読み込み中...</p>
      </div>

      <!-- エラーメッセージ -->
      <p id="error" class="py-20 text-center text-red-700" hidden></p>

      <!-- キャラクター一覧（3列。script.js で中身を作る） -->
      <ul id="character-list" class="grid grid-cols-3 gap-4"></ul>
    </main>
  </body>
</html>
